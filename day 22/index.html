<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/eb89002717.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <canvas id="canvas"></canvas>
        <div class="draw_control">
            <div class="frist_cs">
                <button class="minus">
                    <i class="fa-solid fa-minus"></i>
                </button>
                <div class="draw_size" style="display: flex; align-items: center; justify-content: center; font-size: 1.9rem;">5</div>
                <button class="plus">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <div class="color_selecter"></div>
            </div>
            <button class="clear">
                <i class="fa-solid fa-x"></i>
            </button>
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
