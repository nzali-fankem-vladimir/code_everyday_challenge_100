<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="color_option">dark mode</button>
    <div class="clock_analogique">
        <div class="origin">
        </div>
            <div class="rotate seconde"></div>
            <div class="rotate stick minute"></div>
            <div class="rotate stick heure"></div>
        
    </div>
    <div class="clock_numerique">
        <span class="cnH"></span>:<span class="cnM"></span><span class="cnS">PM</span>
    </div>
    <div class="date">
        <span id="day">MONDAY</span>,
        <span id="month">NOV</span>
        <span class="date_day">2</span>
    </div>


    
<script src="script.js"></script>
</body>
</html>
