<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backbround Slider</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/eb89002717.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="slide-container">
        <div class="slide" style="background-image: url('../images/bg1.jpg');"></div>

        <div class="slide" style="background-image: url('../images/bg2.jpg');"></div>

        <div class="slide" style="background-image: url('../images/bg3.jpg');"></div>

        <div class="slide" style="background-image: url('../images/bg4.jpg');"></div>

        <div class="slide" style="background-image: url('../images/bg5.jpg');"></div>

        <button class="arrow right-arrow" id="right">
            <i class="fa-solid fa-arrow-right"></i>
        </button>
        <button class="arrow left-arrow" id="left">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
    </div>

    
<script src="script.js"></script>
</body>
</html>
